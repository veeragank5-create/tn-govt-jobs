<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TN GOVT JOBS - Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#222;
}

header{
background:linear-gradient(135deg,#08254d,#1769aa);
color:white;
padding:25px;
text-align:center;
}

header h1{
margin:0;
}

.container{
width:95%;
max-width:1000px;
margin:25px auto;
}

.box{
background:white;
padding:25px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 3px 12px rgba(0,0,0,.10);
}

input{
width:100%;
padding:12px;
margin:8px 0 15px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.login-btn{
background:#1769aa;
color:white;
width:100%;
}

.save-btn{
background:#16803c;
color:white;
}

.logout-btn{
background:#d32f2f;
color:white;
}

.delete-btn{
background:#d32f2f;
color:white;
margin-top:10px;
}

.hidden{
display:none;
}

.job-item{
background:#f5f7fa;
padding:15px;
margin:10px 0;
border-radius:8px;
border-left:5px solid #1769aa;
}

.message{
font-weight:bold;
margin-top:10px;
}

a{
color:#1769aa;
}

</style>

</head>

<body>

<header>

<h1>🇮🇳 TN GOVT JOBS</h1>

<p>Admin Dashboard</p>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginBox" class="box">

<h2>🔐 Admin Login</h2>

<label>Username</label>

<input
type="text"
id="username"
placeholder="Enter username"
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
>

<button
class="login-btn"
onclick="login()">

Login

</button>

<p
id="loginMessage"
class="message">
</p>

</div>


<!-- DASHBOARD -->

<div
id="dashboard"
class="hidden">


<div class="box">

<h2>📊 Dashboard</h2>

<p id="jobCount">
📋 Total Jobs: 0
</p>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</div>


<!-- ADD JOB -->

<div class="box">

<h2>➕ Add Job</h2>

<label>Job Title</label>

<input
type="text"
id="jobTitle"
placeholder="Example: TNPSC Group IV 2026"
>

<label>Qualification</label>

<input
type="text"
id="qualification"
placeholder="Example: 10th Pass"
>

<label>Last Date</label>

<input
type="text"
id="lastDate"
placeholder="Example: 07 November 2026"
>

<label>Official Link</label>

<input
type="url"
id="officialLink"
placeholder="https://www.tnpsc.gov.in/"
>

<button
class="save-btn"
onclick="saveJob()">

💾 Save Job

</button>

<p
id="saveMessage"
class="message">
</p>

</div>


<!-- MANAGE JOBS -->

<div class="box">

<h2>📋 Manage Jobs</h2>

<div id="manageJobs">
</div>

</div>


<!-- LATEST UPDATES -->

<div class="box">

<h2>📰 Latest Updates</h2>

<p>
Use this dashboard to add and manage government job notifications.
</p>

</div>


</div>

</div>


<script>


/* LOGIN */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();


    if(
        username === "veeragank" &&
        password === "7002"
    ){

        localStorage.setItem(
            "tnAdminLoggedIn",
            "true"
        );

        showDashboard();

    }else{

        document.getElementById(
            "loginMessage"
        ).innerText =
        "❌ Invalid username or password.";

    }

}


/* SHOW DASHBOARD */

function showDashboard(){

    document.getElementById(
        "loginBox"
    ).classList.add("hidden");

    document.getElementById(
        "dashboard"
    ).classList.remove("hidden");

    loadJobs();

}


/* LOGOUT */

function logout(){

    localStorage.removeItem(
        "tnAdminLoggedIn"
    );

    location.reload();

}


/* CHECK LOGIN */

function checkLogin(){

    const loggedIn =
        localStorage.getItem(
            "tnAdminLoggedIn"
        );

    if(loggedIn === "true"){

        showDashboard();

    }

}


/* SAVE JOB */

async function saveJob(){

    const title =
        document.getElementById("jobTitle").value.trim();

    const qualification =
        document.getElementById("qualification").value.trim();

    const lastDate =
        document.getElementById("lastDate").value.trim();

    const officialLink =
        document.getElementById("officialLink").value.trim();


    if(
        title === "" ||
        qualification === "" ||
        lastDate === "" ||
        officialLink === ""
    ){

        document.getElementById("saveMessage").innerText =
        "❌ Please fill all fields.";

        return;

    }


    const { error } =
        await supabaseClient
        .from("jobs")
        .insert({

            title: title,

            qualification: qualification,

            last_date: lastDate,

            official_link: officialLink

        });


    if(error){

        document.getElementById("saveMessage").innerText =
        "❌ " + error.message;

        return;

    }


    document.getElementById("saveMessage").innerText =
    "✅ Job saved to database!";


    document.getElementById("jobTitle").value = "";

    document.getElementById("qualification").value = "";

    document.getElementById("lastDate").value = "";

    document.getElementById("officialLink").value = "";

}

        document


    let jobs =
        JSON.parse(
            localStorage.getItem(
                "tnGovtJobs"
            )
        ) || [];


    jobs.push({

        title:title,

        qualification:qualification,

        lastDate:lastDate,

        officialLink:officialLink

    });


    localStorage.setItem(
        "tnGovtJobs",
        JSON.stringify(jobs)
    );


    document.getElementById(
        "saveMessage"
    ).innerText =
    "✅ Job saved successfully!";


    document.getElementById(
        "jobTitle"
    ).value = "";

    document.getElementById(
        "qualification"
    ).value = "";

    document.getElementById(
        "lastDate"
    ).value = "";

    document.getElementById(
        "officialLink"
    ).value = "";


    loadJobs();

}


/* LOAD JOBS */

function loadJobs(){

    let jobs =
        JSON.parse(
            localStorage.getItem(
                "tnGovtJobs"
            )
        ) || [];


    const container =
        document.getElementById(
            "manageJobs"
        );


    if(jobs.length === 0){

        container.innerHTML =
        "<p>No jobs added yet.</p>";

    }else{

        let html = "";


        jobs.forEach(function(job,index){

            html += `

            <div class="job-item">

                <h3>
                    📢 ${job.title}
                </h3>

                <p>
                    🎓 <b>Qualification:</b>
                    ${job.qualification}
                </p>

                <p>
                    📅 <b>Last Date:</b>
                    ${job.lastDate}
                </p>

                <p>
                    🔗
                    <a
                    href="${job.officialLink}"
                    target="_blank">

                    Official Link

                    </a>
                </p>

                <button
                class="delete-btn"
                onclick="deleteJob(${index})">

                🗑️ Delete

                </button>

            </div>

            `;

        });


        container.innerHTML = html;

    }


    document.getElementById(
        "jobCount"
    ).innerText =
    "📋 Total Jobs: " + jobs.length;

}


/* DELETE JOB */

function deleteJob(index){

    let jobs =
        JSON.parse(
            localStorage.getItem(
                "tnGovtJobs"
            )
        ) || [];


    if(
        !confirm(
            "Are you sure you want to delete this job?"
        )
    ){

        return;

    }


    jobs.splice(index,1);


    localStorage.setItem(
        "tnGovtJobs",
        JSON.stringify(jobs)
    );


    loadJobs();

}


/* START */

checkLogin();


</script>

</body>

</html>
