<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - TN GOVT JOBS</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f6fb;
}

.header{
    background:#08254d;
    color:white;
    padding:20px;
    text-align:center;
}

.login-box,
.dashboard{
    width:90%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px #ccc;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:6px;
    background:#1769aa;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    opacity:0.9;
}

.dashboard{
    display:none;
}

.card{
    background:#f5f8fc;
    padding:20px;
    margin:15px 0;
    border-radius:8px;
}

.form-box{
    background:#eef5ff;
    padding:20px;
    margin-top:15px;
    border-radius:8px;
    display:none;
}

.logout{
    background:#d32f2f;
}

.error{
    color:red;
    font-weight:bold;
}

.success{
    color:green;
    font-weight:bold;
}

.job-preview{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
    border-left:5px solid #1769aa;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
    


<body>


<!-- HEADER -->

<div class="header">

<h1>🇮🇳 TN GOVT JOBS</h1>

<p>Admin Panel</p>

</div>


<!-- LOGIN -->

<div class="login-box" id="loginBox">

<h2>🔐 Admin Login</h2>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="adminLogin()">
Login
</button>

<p id="error" class="error"></p>

</div>


<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<h2>📊 Admin Dashboard</h2>


<!-- TOTAL JOBS -->

<div class="card">

<h3>📋 Total Jobs</h3>

<h1 id="jobCount">0</h1>

</div>


<!-- ADD JOB -->

<div class="card">

<h3>➕ Add Job</h3>

<p>
Add a new government job notification.
</p>

<button onclick="showAddJob()">
➕ Add Job
</button>


<div
class="form-box"
id="addJobForm">

<h3>📝 New Job Details</h3>


<input
type="text"
id="jobTitle"
placeholder="Job Title">


<input
type="text"
id="qualification"
placeholder="Qualification">


<input
type="text"
id="lastDate"
placeholder="Last Date">


<input
type="text"
id="officialLink"
placeholder="Official Application Link">


<button onclick="saveJob()">
💾 Save Job
</button>


<p
id="saveMessage"
class="success">
</p>

</div>

</div>


<!-- MANAGE JOBS -->

<div class="card">

<h3>✏️ Manage Jobs</h3>

<p>
Manage existing job notifications.
</p>

<button onclick="showJobs()">
View Jobs
</button>

<div id="jobList"></div>

</div>


<!-- LATEST UPDATES -->

<div class="card">

<h3>📢 Latest Updates</h3>

<p>
Manage latest job updates.
</p>

<button onclick="showUpdateMessage()">
Update News
</button>

<p id="updateMessage"></p>

</div>


<br>


<button
class="logout"
onclick="logout()">

Logout

</button>

</div>



<script>
    const SUPABASE_URL =
"https://qgqsaqkzqofcejemjrta.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PVfmRNEvrEq4w1dQ_9QWyQ_KvC6psU2";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ADMIN LOGIN */

function adminLogin(){

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;


    if(
        username === "veeragank" &&
        password === "7002"
    ){

        document.getElementById("loginBox")
        .style.display = "none";


        document.getElementById("dashboard")
        .style.display = "block";


        updateJobCount();


    }else{

        document.getElementById("error")
        .innerText =
        "❌ Invalid Username or Password";

    }

}



/* LOGOUT */

function logout(){

    document.getElementById("dashboard")
    .style.display = "none";


    document.getElementById("loginBox")
    .style.display = "block";


    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

}



/* SHOW ADD JOB */

function showAddJob(){

    let form =
        document.getElementById("addJobForm");


    if(form.style.display === "block"){

        form.style.display = "none";

    }else{

        form.style.display = "block";

    }

}



/* SAVE JOB */
    async function saveJob(){

    let title =
        document.getElementById("jobTitle").value.trim();

    let qualification =
        document.getElementById("qualification").value.trim();

    let lastDate =
        document.getElementById("lastDate").value.trim();

    let officialLink =
        document.getElementById("officialLink").value.trim();


    if(
        title === "" ||
        qualification === "" ||
        lastDate === "" ||
        officialLink === ""
    ){

        document.getElementById("saveMessage").innerText =
        "❌ Please fill all fields.";

        return;

    }


    const { data, error } =
        await supabaseClient
        .from("jobs")
        .insert([
            {
                title: title,
                qualification: qualification,
                last_date: lastDate,
                official_link: officialLink
            }
        ]);


    if(error){

        document.getElementById("saveMessage").innerText =
        "❌ Error: " + error.message;

        return;

    }


    document.getElementById("saveMessage").innerText =
    "✅ Job saved to database!";


    document.getElementById("jobTitle").value = "";

    document.getElementById("qualification").value = "";

    document.getElementById("lastDate").value = "";

    document.getElementById("officialLink").value = "";

}


    let jobs =
        JSON.parse(
            localStorage.getItem("tnGovtJobs")
        ) || [];


    let newJob = {

        title:title,

        qualification:qualification,

        lastDate:lastDate,

        officialLink:officialLink

    };


    jobs.push(newJob);


    localStorage.setItem(
        "tnGovtJobs",
        JSON.stringify(jobs)
    );


    document.getElementById("saveMessage")
    .innerText =
    "✅ Job saved successfully!";


    document.getElementById("jobTitle").value = "";

    document.getElementById("qualification").value = "";

    document.getElementById("lastDate").value = "";

    document.getElementById("officialLink").value = "";


    updateJobCount();

}



/* UPDATE JOB COUNT */

function updateJobCount(){

    let jobs =
        JSON.parse(
            localStorage.getItem("tnGovtJobs")
        ) || [];


    document.getElementById("jobCount")
    .innerText = jobs.length;

}



/* SHOW JOBS */

function showJobs(){

    let jobs =
        JSON.parse(
            localStorage.getItem("tnGovtJobs")
        ) || [];


    let list =
        document.getElementById("jobList");


    if(jobs.length === 0){

        list.innerHTML =
        "<p>No jobs added yet.</p>";

        return;

    }


    list.innerHTML = "";


    jobs.forEach(function(job,index){

        list.innerHTML += `

        <div class="job-preview">

        <h3>
        ${job.title}
        </h3>

        <p>
        🎓 Qualification:
        ${job.qualification}
        </p>

        <p>
        📅 Last Date:
        ${job.lastDate}
        </p>

        <a
        href="${job.officialLink}"
        target="_blank">

        Official Link

        </a>

        <br>

        <button
        onclick="deleteJob(${index})"
        style="background:#d32f2f;">

        🗑️ Delete

        </button>

        </div>

        `;

    });

}



/* DELETE JOB */

function deleteJob(index){

    let jobs =
        JSON.parse(
            localStorage.getItem("tnGovtJobs")
        ) || [];


    jobs.splice(index,1);


    localStorage.setItem(
        "tnGovtJobs",
        JSON.stringify(jobs)
    );


    updateJobCount();

    showJobs();

}



/* UPDATE NEWS */

function showUpdateMessage(){

    document.getElementById("updateMessage")
    .innerText =
    "📢 Latest Updates section is ready.";

}


</script>


</body>

</html>
