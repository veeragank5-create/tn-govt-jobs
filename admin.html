<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>TN GOVT JOBS - Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fb;
    color:#222;
}

/* HEADER */

header{
    background:linear-gradient(
        135deg,
        #06265c,
        #1769aa
    );
    color:white;
    padding:25px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
}

/* MAIN */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:15px;
}

/* LOGIN */

.login-box{
    max-width:450px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.login-box h2{
    text-align:center;
    color:#06265c;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccd5e0;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

button{
    border:none;
    cursor:pointer;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
}

/* BUTTONS */

.primary{
    width:100%;
    margin-top:20px;
    background:#0757c9;
    color:white;
}

.primary:hover{
    background:#06459f;
}

.logout{
    background:#dc3545;
    color:white;
}

.save-btn{
    background:#198754;
    color:white;
    margin-top:20px;
}

.clear-btn{
    background:#6c757d;
    color:white;
    margin-top:20px;
    margin-left:8px;
}

.edit-btn{
    background:#ff9800;
    color:white;
    margin-right:8px;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

/* MESSAGE */

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

/* ADMIN */

#adminPanel{
    display:none;
}

/* TOP BAR */

.admin-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.admin-top h2{
    margin:0;
    color:#06265c;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat h3{
    margin:0;
    color:#0757c9;
    font-size:28px;
}

.stat p{
    margin:5px 0 0;
    color:#666;
}

/* FORM */

.form-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    margin-bottom:25px;
}

.form-box h2{
    margin-top:0;
    color:#06265c;
}

/* SEARCH */

.search-box{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.search-box input{
    margin-top:0;
}

/* JOB LIST */

#jobList{
    display:grid;
    gap:15px;
}

.job{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    border-left:5px solid #0757c9;
}

.job h3{
    margin-top:0;
    color:#06265c;
}

.job p{
    margin:8px 0;
    line-height:1.5;
}

.job-buttons{
    margin-top:15px;
}

/* MOBILE */

@media(max-width:700px){

    header h1{
        font-size:22px;
    }

    .admin-top{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .clear-btn{
        margin-left:0;
        margin-top:10px;
    }

    .job-buttons button{
        width:100%;
        margin-top:8px;
    }

}

</style>

</head>

<body>


<header>

    <h1>🇮🇳 TN GOVT JOBS</h1>

    <p>Admin Dashboard</p>

</header>


<div class="container">


<!-- LOGIN -->

<div id="loginPanel" class="login-box">

    <h2>🔐 Admin Login</h2>

    <label>Username</label>

    <input
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="username">

    <label>Password</label>

    <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password">

    <button
        type="button"
        class="primary"
        onclick="login()">

        Login

    </button>

    <div
        id="loginMessage"
        class="message">
    </div>

</div>



<!-- ADMIN PANEL -->

<div id="adminPanel">


    <!-- TOP -->

    <div class="admin-top">

        <h2>📊 Admin Dashboard</h2>

        <button
            class="logout"
            onclick="logout()">

            Logout

        </button>

    </div>



    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <h3 id="totalJobs">0</h3>

            <p>Total Jobs</p>

        </div>


        <div class="stat">

            <h3 id="latestJobs">0</h3>

            <p>Latest Jobs</p>

        </div>

    </div>



    <!-- ADD / EDIT JOB -->

    <div class="form-box">

        <h2>➕ Add / Edit Job</h2>


        <label>Job Title</label>

        <input
            id="title"
            type="text"
            placeholder="Enter Job Title">


        <label>Qualification</label>

        <input
            id="qualification"
            type="text"
            placeholder="Example: 10th / 12th / Degree">


        <label>Last Date</label>

        <input
            id="lastDate"
            type="text"
            placeholder="Example: 07 November 2026">


        <label>Apply Link</label>

        <input
            id="applyLink"
            type="url"
            placeholder="https://official-website.com">


        <label>Vacancies</label>

        <input
            id="vacancies"
            type="text"
            placeholder="Example: 100 Posts">


        <label>Salary</label>

        <input
            id="salary"
            type="text"
            placeholder="Example: ₹18,000 - ₹50,000">


        <label>Job Description</label>

        <textarea
            id="description"
            rows="5"
            placeholder="Enter important job details"></textarea>


        <button
            class="save-btn"
            onclick="saveJob()">

            💾 Save Job

        </button>


        <button
            class="clear-btn"
            onclick="clearForm()">

            Clear

        </button>


        <div
            id="saveMessage"
            class="message">
        </div>

    </div>



    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="searchJob"
            type="text"
            placeholder="🔎 Search jobs..."
            oninput="showJobs()">

    </div>



    <!-- JOB LIST -->

    <div id="jobList">

        Loading jobs...

    </div>


</div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://qgqsaqkzqofcejemjrta.supabase.co";


const SUPABASE_KEY =
"sb_publishable_PVfmRNEvrEq4w1dQ_9QWyQ_KvC6psU2";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =========================
   EDIT ID
========================= */

let editingJobId = null;



/* =========================
   LOGIN
========================= */

window.login = function(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(
        username === "veeragank" &&
        password === "7002"
    ){

        localStorage.setItem(
            "tn_admin_login",
            "true"
        );


        document
        .getElementById("loginMessage")
        .innerText = "";


        showAdmin();

    }else{

        document
        .getElementById("loginMessage")
        .innerText =
        "❌ Invalid Username or Password";

    }

};



/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

    document
    .getElementById("loginPanel")
    .style
    .display = "none";


    document
    .getElementById("adminPanel")
    .style
    .display = "block";


    showJobs();

}



/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "tn_admin_login"
    );


    location.reload();

}



/* =========================
   SAVE / UPDATE JOB
========================= */

async function saveJob(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();


    if(title === ""){

        document
        .getElementById("saveMessage")
        .innerText =
        "❌ Please enter Job Title.";

        return;

    }


    const job = {

        title: title,


        qualification:
            document
            .getElementById("qualification")
            .value
            .trim(),


        last_date:
            document
            .getElementById("lastDate")
            .value
            .trim(),


        official_link:
            document
            .getElementById("applyLink")
            .value
            .trim(),


        vacancies:
            document
            .getElementById("vacancies")
            .value
            .trim(),


        salary:
            document
            .getElementById("salary")
            .value
            .trim(),


        job_description:
            document
            .getElementById("description")
            .value
            .trim()

    };


    let result;


    /* EDIT */

    if(editingJobId){

        result =
            await supabaseClient
            .from("jobs")
            .update(job)
            .eq("id", editingJobId)
            .select();


    }

    /* NEW JOB */

    else{

        result =
            await supabaseClient
            .from("jobs")
            .insert([job])
            .select();

    }


    const { data, error } = result;


    if(error){

        document
        .getElementById("saveMessage")
        .innerText =
        "❌ " + error.message;


        console.log(error);

        return;

    }


    if(editingJobId){

        document
        .getElementById("saveMessage")
        .innerText =
        "✅ Job updated successfully!";

    }else{

        document
        .getElementById("saveMessage")
        .innerText =
        "✅ Job saved to database!";

    }


    editingJobId = null;


    clearForm();


    showJobs();


    console.log(
        "Saved / Updated Job:",
        data
    );

}



/* =========================
   EDIT JOB
========================= */

window.editJob = async function(id){

    editingJobId = id;


    const { data, error } =
        await supabaseClient
        .from("jobs")
        .select("*")
        .eq("id", id)
        .single();


    if(error){

        alert(
            "❌ " +
            error.message
        );

        console.log(error);

        return;

    }


    document
    .getElementById("title")
    .value =
        data.title || "";


    document
    .getElementById("qualification")
    .value =
        data.qualification || "";


    document
    .getElementById("lastDate")
    .value =
        data.last_date || "";


    document
    .getElementById("applyLink")
    .value =
        data.official_link || "";


    document
    .getElementById("vacancies")
    .value =
        data.vacancies || "";


    document
    .getElementById("salary")
    .value =
        data.salary || "";


    document
    .getElementById("description")
    .value =
        data.job_description || "";


    document
    .getElementById("saveMessage")
    .innerText =
        "✏️ Editing Job ID: " + id;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};



/* =========================
   DELETE JOB
========================= */

window.deleteJob = async function(id){

    if(
        !confirm(
            "Are you sure you want to delete this job?"
        )
    ){

        return;

    }


    const { error } =
        await supabaseClient
        .from("jobs")
        .delete()
        .eq("id", id);


    if(error){

        alert(
            "❌ Delete failed: " +
            error.message
        );

        console.log(error);

        return;

    }


    alert(
        "✅ Job deleted successfully!"
    );


    showJobs();

};



/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document
    .getElementById("title")
    .value = "";


    document
    .getElementById("qualification")
    .value = "";


    document
    .getElementById("lastDate")
    .value = "";


    document
    .getElementById("applyLink")
    .value = "";


    document
    .getElementById("vacancies")
    .value = "";


    document
    .getElementById("salary")
    .value = "";


    document
    .getElementById("description")
    .value = "";


    editingJobId = null;

}



/* =========================
   SHOW JOBS
========================= */

async function showJobs(){

    const search =
        document
        .getElementById("searchJob")
        .value
        .toLowerCase()
        .trim();


    const container =
        document
        .getElementById("jobList");


    container.innerHTML =
        "Loading jobs...";


    const { data, error } =
        await supabaseClient
        .from("jobs")
        .select("*")
        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        container.innerHTML =
            "❌ " +
            error.message;


        console.log(error);

        return;

    }


    container.innerHTML = "";


    const filteredJobs =
        data.filter(
            function(job){

                const text =
                    (
                        (job.title || "") +
                        " " +
                        (job.qualification || "") +
                        " " +
                        (job.vacancies || "") +
                        " " +
                        (job.salary || "") +
                        " " +
                        (job.job_description || "")
                    )
                    .toLowerCase();


                return text.includes(search);

            }
        );


    if(filteredJobs.length === 0){

        container.innerHTML =
            "<p>No jobs found.</p>";

    }


    filteredJobs.forEach(
        function(job){

            const div =
                document.createElement("div");


            div.className =
                "job";


            div.innerHTML = `

                <h3>
                    📢 ${escapeHTML(job.title)}
                </h3>


                <p>
                    🎓 <b>Qualification:</b>
                    ${escapeHTML(
                        job.qualification ||
                        "As per post"
                    )}
                </p>


                <p>
                    📅 <b>Last Date:</b>
                    ${escapeHTML(
                        job.last_date ||
                        "Not set"
                    )}
                </p>


                <p>
                    👥 <b>Vacancies:</b>
                    ${escapeHTML(
                        job.vacancies ||
                        "As per post"
                    )}
                </p>


                <p>
                    💰 <b>Salary:</b>
                    ${escapeHTML(
                        job.salary ||
                        "As per post"
                    )}
                </p>


                <p>
                    📝 <b>Description:</b>
                    ${escapeHTML(
                        job.job_description ||
                        "Not set"
                    )}
                </p>


                <p>
                    🔗 <b>Official Link:</b>
                    ${
                        job.official_link
                        ?
                        `<a
                            href="${escapeAttribute(
                                job.official_link
                            )}"
                            target="_blank">
                            Open Official Website
                        </a>`
                        :
                        "Not set"
                    }
                </p>


                <div class="job-buttons">

                    <button
                        class="edit-btn"
                        onclick="editJob(${job.id})">

                        ✏️ Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteJob(${job.id})">

                        🗑️ Delete

                    </button>

                </div>

            `;


            container.appendChild(div);

        }
    );


    document
    .getElementById("totalJobs")
    .innerText =
        data.length;


    document
    .getElementById("latestJobs")
    .innerText =
        Math.min(
            data.length,
            5
        );

}



/* =========================
   SECURITY DISPLAY HELPERS
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =========================
   AUTO LOGIN
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        if(
            localStorage.getItem(
                "tn_admin_login"
            ) === "true"
        ){

            showAdmin();

        }

    }
);

</script>

</body>

</html>
