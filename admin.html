<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TN Job Alert - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#17233b;
}

header{
  background:#062b63;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header b{
  font-size:20px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border:1px solid #e1e7f0;
  border-radius:12px;
  padding:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.login{
  max-width:400px;
  margin:70px auto;
}

h2{
  color:#062b63;
  font-size:19px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-size:13px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccd6e5;
  border-radius:7px;
  font-size:14px;
}

textarea{
  min-height:80px;
}

button{
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#0757c9;
  color:white;
}

.danger{
  background:#e54848;
  color:white;
}

.edit{
  background:#edf4ff;
  color:#0757c9;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:white;
  border:1px solid #e1e7f0;
  border-radius:10px;
  padding:15px;
}

.stat b{
  display:block;
  font-size:25px;
  color:#0757c9;
  margin-top:5px;
}

.job{
  border:1px solid #e1e7f0;
  border-radius:9px;
  padding:14px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.job h3{
  margin:0 0 5px;
  font-size:15px;
  color:#173b72;
}

.job p{
  margin:3px 0;
  color:#68758a;
  font-size:12px;
}

.note{
  background:#fff8e6;
  border:1px solid #f2df9a;
  padding:10px;
  border-radius:7px;
  font-size:12px;
  margin-top:12px;
}

.hidden{
  display:none !important;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .job{
    flex-direction:column;
  }

  header{
    gap:10px;
  }

  header b{
    font-size:16px;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>

  <b>🏛️ TN Job Alert - Admin Panel</b>

  <button
    class="danger"
    onclick="logout()">
    Logout
  </button>

</header>


<!-- LOGIN -->

<div id="loginBox" class="login card">

  <h2>🔐 Admin Login</h2>

  <label>Username</label>

  <input
    id="username"
    type="text"
    placeholder="Enter username">


  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Enter password">


  <div class="actions">

    <button
      class="primary"
      onclick="login()">

      Login

    </button>

  </div>


  <div class="note">

    Demo Login<br><br>

    if(
  username === "veeragank" &&
  password === "7002"
)

  </div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="container hidden">


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      Total Jobs

      <b id="totalJobs">0</b>

    </div>


    <div class="stat">

      Latest Jobs

      <b id="latestJobs">0</b>

    </div>


    <div class="stat">

      Categories

      <b>5</b>

    </div>

  </div>


  <!-- ADD JOB -->

  <div class="card">

    <h2 id="formTitle">
      ➕ Add New Government Job
    </h2>


    <input
      id="editId"
      type="hidden">


    <label>
      Job Title *
    </label>

    <input
      id="title"
      type="text"
      placeholder="Example: TNPSC Group 4">


    <label>
      Department
    </label>

    <input
      id="department"
      type="text"
      placeholder="Example: TNPSC">


    <label>
      Category
    </label>

    <select id="category">

      <option value="TNPSC">
        TNPSC
      </option>

      <option value="Railway">
        Railway
      </option>

      <option value="Bank">
        Bank
      </option>

      <option value="SSC">
        SSC
      </option>

      <option value="Other">
        Other
      </option>

    </select>


    <label>
      Qualification
    </label>

    <input
      id="qualification"
      type="text"
      placeholder="10th / 12th / Degree">


    <label>
      Vacancies
    </label>

    <input
      id="vacancy"
      type="text"
      placeholder="1000">


    <label>
      Salary
    </label>

    <input
      id="salary"
      type="text"
      placeholder="₹18,000 - ₹75,000">


    <label>
      Last Date
    </label>

    <input
      id="lastDate"
      type="date">


    <label>
      Apply Link
    </label>

    <input
      id="applyLink"
      type="url"
      placeholder="https://official-website.com">


    <label>
      Job Description
    </label>

    <textarea
      id="description"
      placeholder="Enter important job details">
    </textarea>


    <div class="actions">

      <button
        class="primary"
        onclick="saveJob()">

        💾 Save Job

      </button>


      <button
        class="edit"
        onclick="clearForm()">

        Clear

      </button>

    </div>

  </div>


  <!-- JOB LIST -->

  <div class="card">

    <h2>
      📋 Manage Government Jobs
    </h2>


    <input
      id="searchJob"
      type="text"
      placeholder="🔍 Search jobs..."
      oninput="showJobs()">


    <div id="jobList"></div>

  </div>

</div>


<script>

/* =========================
   DATABASE
========================= */

const STORAGE_KEY = "tn_job_alert_jobs";

let jobs =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || [];


/* =========================
   DEFAULT JOBS
========================= */

if(jobs.length === 0){

  jobs = [

    {
      id: Date.now(),

      title:"TNPSC Group 4 2026",

      department:
      "Tamil Nadu Public Service Commission",

      category:"TNPSC",

      qualification:"10th",

      vacancy:"1000+",

      salary:"As per notification",

      lastDate:"",

      applyLink:
      "https://www.tnpsc.gov.in/",

      description:
      "Check official TNPSC notification before applying."

    }

  ];

  saveDatabase();

}


/* =========================
   DATABASE SAVE
========================= */

function saveDatabase(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(jobs)
  );

}


/* =========================
   LOGIN
========================= */

function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;


  if(
    username === "admin" &&
    password === "admin123"
  ){

    localStorage.setItem(
      "tn_admin_login",
      "true"
    );

    showAdmin();

  }

  else{

    alert(
      "Wrong username or password"
    );

  }

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.remove("hidden");

  showJobs();

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "tn_admin_login"
  );

  location.reload();

}


/* =========================
   SAVE JOB
========================= */

function saveJob(){

  const title =
    document.getElementById("title").value.trim();


  if(title === ""){

    alert(
      "Please enter Job Title"
    );

    return;

  }


  const editId =
    document.getElementById("editId").value;


  const job = {

    id:
      editId
      ? Number(editId)
      : Date.now(),

    title:title,

    department:
      document.getElementById(
        "department"
      ).value,

    category:
      document.getElementById(
        "category"
      ).value,

    qualification:
      document.getElementById(
        "qualification"
      ).value,

    vacancy:
      document.getElementById(
        "vacancy"
      ).value,

    salary:
      document.getElementById(
        "salary"
      ).value,

    lastDate:
      document.getElementById(
        "lastDate"
      ).value,

    applyLink:
      document.getElementById(
        "applyLink"
      ).value,

    description:
      document.getElementById(
        "description"
      ).value

  };


  if(editId){

    jobs =
      jobs.map(function(item){

        return item.id === Number(editId)
          ? job
          : item;

      });

    alert(
      "Job updated successfully!"
    );

  }

  else{

    jobs.unshift(job);

    alert(
      "New job added successfully!"
    );

  }


  saveDatabase();

  clearForm();

  showJobs();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document.getElementById(
    "editId"
  ).value = "";

  document.getElementById(
    "title"
  ).value = "";

  document.getElementById(
    "department"
  ).value = "";

  document.getElementById(
    "category"
  ).value = "TNPSC";

  document.getElementById(
    "qualification"
  ).value = "";

  document.getElementById(
    "vacancy"
  ).value = "";

  document.getElementById(
    "salary"
  ).value = "";

  document.getElementById(
    "lastDate"
  ).value = "";

  document.getElementById(
    "applyLink"
  ).value = "";

  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "formTitle"
  ).innerText =
    "➕ Add New Government Job";

}


/* =========================
   EDIT JOB
========================= */

function editJob(id){

  const job =
    jobs.find(function(item){

      return item.id === id;

    });


  if(!job) return;


  document.getElementById(
    "editId"
  ).value = job.id;


  document.getElementById(
    "title"
  ).value = job.title;


  document.getElementById(
    "department"
  ).value = job.department;


  document.getElementById(
    "category"
  ).value = job.category;


  document.getElementById(
    "qualification"
  ).value =
    job.qualification;


  document.getElementById(
    "vacancy"
  ).value = job.vacancy;


  document.getElementById(
    "salary"
  ).value = job.salary;


  document.getElementById(
    "lastDate"
  ).value = job.lastDate;


  document.getElementById(
    "applyLink"
  ).value = job.applyLink;


  document.getElementById(
    "description"
  ).value =
    job.description;


  document.getElementById(
    "formTitle"
  ).innerText =
    "✏️ Edit Government Job";


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   DELETE JOB
========================= */

function deleteJob(id){

  const confirmDelete =
    confirm(
      "இந்த job-ஐ delete செய்ய வேண்டுமா?"
    );


  if(!confirmDelete) return;


  jobs =
    jobs.filter(function(item){

      return item.id !== id;

    });


  saveDatabase();

  showJobs();

}


/* =========================
   SHOW JOBS
========================= */

function showJobs(){

  const search =
    document
      .getElementById(
        "searchJob"
      )
      .value
      .toLowerCase();


  const list =
    jobs.filter(function(job){

      return (

        job.title +
        " " +
        job.department +
        " " +
        job.category

      )
      .toLowerCase()
      .includes(search);

    });


  const container =
    document.getElementById(
      "jobList"
    );


  container.innerHTML = "";


  list.forEach(function(job){

    const div =
      document.createElement(
        "div"
      );

    div.className = "job";


    div.innerHTML = `

      <div>

        <h3>
          ${escapeHTML(job.title)}
        </h3>

        <p>
          🏢 ${escapeHTML(job.department)}
        </p>

        <p>
          📂 ${escapeHTML(job.category)}
          |
          🎓 ${escapeHTML(job.qualification)}
        </p>

        <p>
          👥 Vacancy:
          ${escapeHTML(job.vacancy)}
          |
          💰 Salary:
          ${escapeHTML(job.salary)}
        </p>

        <p>
          📅 Last Date:
          ${job.lastDate || "Not set"}
        </p>

      </div>

      <div>

        <button
          class="edit"
          onclick="editJob(${job.id})">

          ✏️ Edit

        </button>

        <button
          class="danger"
          onclick="deleteJob(${job.id})">

          🗑️ Delete

        </button>

      </div>

    `;


    container.appendChild(div);

  });


  document.getElementById(
    "totalJobs"
  ).innerText =
    jobs.length;


  document.getElementById(
    "latestJobs"
  ).innerText =
    Math.min(
      jobs.length,
      5
    );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,
      function(char){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[char];

      }
    );

}


/* =========================
   AUTO LOGIN
========================= */

if(
  localStorage.getItem(
    "tn_admin_login"
  ) === "true"
){

  showAdmin();

}

</script>

</body>
</html>
