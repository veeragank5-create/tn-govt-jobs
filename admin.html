<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TN GOVT JOBS - Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#17233b;
}

/* HEADER */

header{
    background:#062b63;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header b{
    font-size:20px;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* CARD */

.card{
    background:white;
    border:1px solid #e1e7f0;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
    margin-bottom:20px;
}

/* LOGIN */

.login{
    max-width:400px;
    margin:70px auto;
}

h2{
    color:#062b63;
    font-size:19px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-size:13px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccd6e5;
    border-radius:7px;
    font-size:14px;
}

textarea{
    min-height:80px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#0757c9;
    color:white;
}

.danger{
    background:#e54848;
    color:white;
}

.edit{
    background:#edf4ff;
    color:#0757c9;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:16px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:white;
    border:1px solid #e1e7f0;
    border-radius:10px;
    padding:15px;
}

.stat b{
    display:block;
    font-size:25px;
    color:#0757c9;
    margin-top:5px;
}

.job{
    border:1px solid #e1e7f0;
    border-radius:9px;
    padding:14px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.job h3{
    margin:0 0 5px;
    font-size:15px;
    color:#173b72;
}

.job p{
    margin:3px 0;
    color:#68758a;
    font-size:12px;
}

.hidden{
    display:none !important;
}

.error{
    color:#d93025;
    margin-top:12px;
    font-weight:bold;
}

.success{
    color:#198754;
    margin-top:12px;
    font-weight:bold;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .job{
        flex-direction:column;
    }

    header b{
        font-size:16px;
    }

    .container{
        padding:12px;
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <b>🏛️ TN GOVT JOBS - Admin Panel</b>

    <button
        id="logoutButton"
        class="danger hidden"
        onclick="logout()">

        Logout

    </button>

</header>


<!-- LOGIN -->

<div
    id="loginBox"
    class="login card">

    <h2>🔐 Admin Login</h2>

    <label>
        Username
    </label>

    <input
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="username">


    <label>
        Password
    </label>

    <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password">


    <div class="actions">

        <button
            class="primary"
            onclick="login()">

            Login

        </button>

    </div>


    <p
        id="loginMessage"
        class="error">
    </p>

</div>


<!-- ADMIN PANEL -->

<div
    id="adminPanel"
    class="container hidden">


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            Total Jobs

            <b id="totalJobs">0</b>

        </div>


        <div class="stat">

            Latest Jobs

            <b id="latestJobs">0</b>

        </div>


        <div class="stat">

            Categories

            <b>10</b>

        </div>

    </div>


    <!-- ADD JOB -->

    <div class="card">

        <h2 id="formTitle">
            ➕ Add New Government Job
        </h2>


        <input
            id="editId"
            type="hidden">


        <label>
            Job Title *
        </label>

        <input
            id="title"
            type="text"
            placeholder="Example: TNPSC Group 4">


        <label>
            Department
        </label>

        <input
            id="department"
            type="text"
            placeholder="Example: TNPSC">


        <label>
            Category
        </label>

        <select id="category">

            <option value="TNPSC">
                TNPSC
            </option>

            <option value="RRB">
                RRB
            </option>

            <option value="SSC">
                SSC
            </option>

            <option value="Bank">
                Bank
            </option>

            <option value="JE">
                JE
            </option>

            <option value="Police">
                Police
            </option>

            <option value="Teacher">
                Teacher
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>
            Qualification
        </label>

        <input
            id="qualification"
            type="text"
            placeholder="10th / 12th / Degree">


        <label>
            Vacancies
        </label>

        <input
            id="vacancy"
            type="text"
            placeholder="1000">


        <label>
            Salary
        </label>

        <input
            id="salary"
            type="text"
            placeholder="₹18,000 - ₹75,000">


        <label>
            Last Date
        </label>

        <input
            id="lastDate"
            type="date">


        <label>
            Apply Link
        </label>

        <input
            id="applyLink"
            type="url"
            placeholder="https://official-website.com">


        <label>
            Job Description
        </label>

        <textarea
            id="description"
            placeholder="Enter important job details">
        </textarea>


        <div class="actions">

            <button
                class="primary"
                onclick="saveJob()">

                💾 Save Job

            </button>


            <button
                class="edit"
                onclick="clearForm()">

                Clear

            </button>

        </div>


        <p
            id="saveMessage"
            class="success">
        </p>

    </div>


    <!-- MANAGE JOBS -->

    <div class="card">

        <h2>
            📋 Manage Government Jobs
        </h2>


        <input
            id="searchJob"
            type="text"
            placeholder="🔍 Search jobs..."
            oninput="showJobs()">


        <div id="jobList"></div>

    </div>

</div>


<script>
<script>

const SUPABASE_URL =
"https://qgqsaqkzqofcejemjrta.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PVfmRNEvrEq4w1dQ_9QWyQ_KvC6psU2";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* LOGIN */

function login(){

/* =========================
   LOGIN
========================= */

function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    if(
        username === "veeragank" &&
        password === "7002"
    ){

        localStorage.setItem(
            "tn_admin_login",
            "true"
        );


        document
        .getElementById("loginMessage")
        .innerText = "";


        showAdmin();

    }

    else{

        document
        .getElementById("loginMessage")
        .innerText =
        "❌ Invalid username or password.";

    }

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

    document
    .getElementById("loginBox")
    .classList
    .add("hidden");


    document
    .getElementById("adminPanel")
    .classList
    .remove("hidden");


    document
    .getElementById("logoutButton")
    .classList
    .remove("hidden");


    showJobs();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "tn_admin_login"
    );

    location.reload();

}


/* =========================
   DATABASE
========================= */

const STORAGE_KEY =
"tn_job_alert_jobs";


let jobs =
JSON.parse(
    localStorage.getItem(
        STORAGE_KEY
    )
) || [];


/* =========================
   SAVE DATABASE
========================= */

function saveDatabase(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(jobs)
    );

}


/* =========================
   SAVE JOB
========================= */

function saveJob(){

    const title =
        document
        .getElementById("title")
        .value
        .trim();


    if(title === ""){

        document
        .getElementById("saveMessage")
        .innerText =
        "❌ Please enter Job Title.";

        return;

    }


    const editId =
        document
        .getElementById("editId")
        .value;


    const job = {

        id:
        editId
        ? Number(editId)
        : Date.now(),

        title:title,

        department:
        document
        .getElementById("department")
        .value
        .trim(),

        category:
        document
        .getElementById("category")
        .value,

        qualification:
        document
        .getElementById("qualification")
        .value
        .trim(),

        vacancy:
        document
        .getElementById("vacancy")
        .value
        .trim(),

        salary:
        document
        .getElementById("salary")
        .value
        .trim(),

        lastDate:
        document
        .getElementById("lastDate")
        .value,

        applyLink:
        document
        .getElementById("applyLink")
        .value
        .trim(),

        description:
        document
        .getElementById("description")
        .value
        .trim()

    };


    if(editId){

        jobs =
        jobs.map(function(item){

            return item.id === Number(editId)
                ? job
                : item;

        });


        document
        .getElementById("saveMessage")
        .innerText =
        "✅ Job updated successfully!";

    }

    else{

        jobs.unshift(job);


        document
        .getElementById("saveMessage")
        .innerText =
        "✅ Job added successfully!";

    }


    saveDatabase();

    clearForm();

    showJobs();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

    document
    .getElementById("editId")
    .value = "";


    document
    .getElementById("title")
    .value = "";


    document
    .getElementById("department")
    .value = "";


    document
    .getElementById("category")
    .value = "TNPSC";


    document
    .getElementById("qualification")
    .value = "";


    document
    .getElementById("vacancy")
    .value = "";


    document
    .getElementById("salary")
    .value = "";


    document
    .getElementById("lastDate")
    .value = "";


    document
    .getElementById("applyLink")
    .value = "";


    document
    .getElementById("description")
    .value = "";


    document
    .getElementById("formTitle")
    .innerText =
    "➕ Add New Government Job";

}


/* =========================
   EDIT JOB
========================= */

function editJob(id){

    const job =
        jobs.find(function(item){

            return item.id === id;

        });


    if(!job) return;


    document
    .getElementById("editId")
    .value = job.id;


    document
    .getElementById("title")
    .value = job.title;


    document
    .getElementById("department")
    .value = job.department;


    document
    .getElementById("category")
    .value = job.category;


    document
    .getElementById("qualification")
    .value =
    job.qualification;


    document
    .getElementById("vacancy")
    .value =
    job.vacancy;


    document
    .getElementById("salary")
    .value =
    job.salary;


    document
    .getElementById("lastDate")
    .value =
    job.lastDate;


    document
    .getElementById("applyLink")
    .value =
    job.applyLink;


    document
    .getElementById("description")
    .value =
    job.description;


    document
    .getElementById("formTitle")
    .innerText =
    "✏️ Edit Government Job";


    window.scrollTo(0,0);

}


/* =========================
   DELETE JOB
========================= */

function deleteJob(id){

    if(
        !confirm(
            "இந்த job-ஐ delete செய்ய வேண்டுமா?"
        )
    ){

        return;

    }


    jobs =
    jobs.filter(function(item){

        return item.id !== id;

    });


    saveDatabase();

    showJobs();

}


/* =========================
   SHOW JOBS
========================= */

function showJobs(){

    const search =
        document
        .getElementById("searchJob")
        .value
        .toLowerCase();


    const container =
        document
        .getElementById("jobList");


    container.innerHTML = "";


    const filteredJobs =
        jobs.filter(function(job){

            const text =
                (
                    job.title +
                    " " +
                    job.department +
                    " " +
                    job.category +
                    " " +
                    job.qualification
                )
                .toLowerCase();


            return text.includes(search);

        });


    filteredJobs.forEach(function(job){

        const div =
            document.createElement("div");


        div.className = "job";


        div.innerHTML = `

            <div>

                <h3>
                    ${escapeHTML(job.title)}
                </h3>

                <p>
                    🏢 ${escapeHTML(job.department)}
                </p>

                <p>
                    📂 ${escapeHTML(job.category)}
                </p>

                <p>
                    🎓 ${escapeHTML(job.qualification)}
                </p>

                <p>
                    👥 Vacancy:
                    ${escapeHTML(job.vacancy)}
                </p>

                <p>
                    📅 Last Date:
                    ${job.lastDate || "Not set"}
                </p>

            </div>

            <div>

                <button
                    class="edit"
                    onclick="editJob(${job.id})">

                    ✏️ Edit

                </button>

                <button
                    class="danger"
                    onclick="deleteJob(${job.id})">

                    🗑️ Delete

                </button>

            </div>

        `;


        container.appendChild(div);

    });


    document
    .getElementById("totalJobs")
    .innerText =
    jobs.length;


    document
    .getElementById("latestJobs")
    .innerText =
    Math.min(
        jobs.length,
        5
    );

}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value){

    return String(value || "")
    .replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


/* =========================
   AUTO LOGIN
========================= */

if(
    localStorage.getItem(
        "tn_admin_login"
    ) === "true"
){

    showAdmin();

}

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
